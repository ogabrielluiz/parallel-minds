# generated by inbox-loops setup; edit and re-run setup to apply
inbox_dir: /abs/path/to/inbox-dir
loops:
  pr:
    enabled: true
    cadence: "13 */3 * * *"
    repo: "owner/name"
    github_login: "your-gh-login"
  jira:
    enabled: true
    cadence: "43 */3 * * *"
    project_key: "LE"
    # Epics you own. Children of these are watched for new activity (created,
    # status changes) and surfaced as activity: tasks. Leave empty to disable.
    owned_epics: []
    jql_prefixes:
      - "assignee = currentUser()"
  vuln:
    enabled: true
    cadence: "33 */6 * * *"
    target_paths:
      - "src/path/to/scan"
    rotation: []
    sensitive: true
  dispatcher:
    enabled: true
    cadence: "23 * * * *"
    consumer_cap: 5
    routing_overrides: {}
